[project]
name = "funserver"
version = "1.0.72"
description = "提供跨平台安装、进程管理和命令行控制的 Python 服务器管理框架"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [ "click>=8.1.8", "funshell>=1.0.2", "farlog>=1.1.7", "psutil>=7.0.0", "typer>=0.15.3",]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.scripts]
funserver = "funserver.servers.base.base:funserver"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funserver"
Releases = "https://github.com/farfarfun/funserver/releases"

[tool.setuptools]
license-files = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [ "pytest>=7.0", "ruff>=0.6",]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [ "E", "F", "I", "N", "W",]
ignore = [
    # farlog（基于 loguru）的日志调用用 `{}` 占位符传参，不是 stdlib logging 的
    # `%s` 语法；ruff 把 logger 调用当成 stdlib logging 处理，误判为参数过多。
    "PLE1205",
]
